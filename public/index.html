<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>India Cloudflare 优选 IP</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.6}
    pre{padding:16px;border:1px solid #ddd;border-radius:12px;overflow:auto}
  </style>
</head>
<body>
  <h1>India Cloudflare 优选 IP</h1>
  <p>由 Mac 本地网络定时测速生成，仅保留印度 Cloudflare PoP。</p>
  <p><a href="./india.txt">india.txt</a> · <a href="./india.json">india.json</a> · <a href="./result.csv">result.csv</a></p>
  <pre id="ips">尚未生成结果</pre>
  <script>
    fetch('./india.txt?ts=' + Date.now())
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => document.getElementById('ips').textContent = t || '暂无结果')
      .catch(() => document.getElementById('ips').textContent = '尚未生成结果');
  </script>
</body>
</html>
